openapi: 3.1.0
info:
  title: HamoPMS API
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
  description: |
    Versioned contract for the Sprint 1 HamoPMS endpoints. All successful JSON
    responses use a `data` envelope and errors use the shared `error` envelope.
servers:
  - url: /api/v1
tags:
  - name: Authentication
    description: Registration, token issuance, revocation, and current-user access.
  - name: Availability
    description: Property-scoped room-type availability searches.
  - name: Room inventory
    description: Property-scoped rooms, amenities, status restrictions, and audit history.
  - name: Reservations
    description: Reservation creation, retrieval, updates, and deletion.
  - name: Check-in
    description: Front-desk room assignment and guest arrival processing.
  - name: Check-out
    description: Folio finalization, balance validation, and room release.
  - name: In-stay modifications
    description: Checked-in room moves, extensions, and early departures.
  - name: Ancillary charges
    description: Property charge types and immutable add-on folio postings.
  - name: Payments
    description: Idempotent intent, capture, refund, void, and split settlement.
  - name: Payment webhooks
    description: Signed gateway settlement reconciliation.
  - name: Reports
    description: Property-scoped operational and occupancy reports with JSON or CSV output.
  - name: Housekeeping
    description: Checkout-created room turnaround tasks and cleaning transitions.
  - name: Maintenance
    description: Room maintenance tickets, escalation, assignment, and inventory blocking.
paths:
  /auth/register:
    post:
      tags: [Authentication]
      operationId: registerUser
      summary: Register a user and issue an API token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/login:
    post:
      tags: [Authentication]
      operationId: loginUser
      summary: Authenticate and issue an API token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/forgot-password:
    post:
      tags: [Authentication]
      operationId: requestPasswordReset
      summary: Request an enumeration-safe password reset link
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Request accepted whether or not the account exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/reset-password:
    post:
      tags: [Authentication]
      operationId: resetPassword
      summary: Reset a password with a valid broker token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset and existing API tokens revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logoutUser
      summary: Revoke the current API token
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/me:
    get:
      tags: [Authentication]
      operationId: getAuthenticatedUser
      summary: Return the authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /availability:
    get:
      tags: [Availability]
      operationId: searchAvailability
      summary: Search available room types for a stay
      description: Supply the property through `property_id` or `X-Property-ID`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PropertyHeader'
        - name: property_id
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Identifier'
        - name: check_in
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: check_out
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: occupancy
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Matching room types and inventory counts
          headers:
            Server-Timing:
              schema:
                type: string
            X-Response-Time-Target:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityResponse'
        '400':
          $ref: '#/components/responses/PropertyContextRequired'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/PropertyContextMismatch'
        '422':
          $ref: '#/components/responses/ValidationError'
  /properties/{propertyId}/amenities:
    parameters:
      - $ref: '#/components/parameters/PropertyId'
    get:
      tags: [Room inventory]
      operationId: listAmenities
      summary: List property amenities
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated amenities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AmenityCollectionResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Room inventory]
      operationId: createAmenity
      summary: Create a property amenity
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmenityRequest'
      responses:
        '201':
          description: Amenity created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AmenityResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /properties/{propertyId}/amenities/{amenityId}:
    parameters:
      - $ref: '#/components/parameters/PropertyId'
      - $ref: '#/components/parameters/AmenityId'
    get:
      tags: [Room inventory]
      operationId: getAmenity
      summary: Get a property amenity
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Amenity details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AmenityResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Room inventory]
      operationId: updateAmenity
      summary: Update a property amenity
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmenityUpdateRequest'
      responses:
        '200':
          description: Amenity updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AmenityResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Room inventory]
      operationId: deleteAmenity
      summary: Delete a property amenity and detach it from rooms
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Amenity deleted
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /properties/{propertyId}/rooms/{roomId}/amenities:
    put:
      tags: [Room inventory]
      operationId: assignRoomAmenities
      summary: Replace a room's amenities with a property-scoped set
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PropertyId'
        - $ref: '#/components/parameters/RoomId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmenityAssignmentRequest'
      responses:
        '200':
          description: Room with assigned amenities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /bookings:
    get:
      tags: [Reservations]
      operationId: listReservations
      summary: List reservations for the authenticated user and property
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequiredPropertyHeader'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated reservations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingCollectionResponse'
        '400':
          $ref: '#/components/responses/PropertyContextRequired'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Reservations]
      operationId: createReservation
      summary: Create a confirmed reservation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
      responses:
        '201':
          description: Reservation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/InventoryUnavailable'
        '422':
          $ref: '#/components/responses/ValidationError'
  /bookings/{bookingId}:
    parameters:
      - $ref: '#/components/parameters/BookingId'
    get:
      tags: [Reservations]
      operationId: getReservation
      summary: Return a reservation
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Reservation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Reservations]
      operationId: updateReservation
      summary: Update a reservation
      description: |
        Modifies a pending or confirmed reservation and appends an immutable
        folio rate adjustment plus a before/after audit record.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBookingRequest'
      responses:
        '200':
          description: Updated reservation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Reservations]
      operationId: deleteReservation
      summary: Delete a reservation
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Reservation deleted
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /bookings/{bookingId}/check-in:
    parameters:
      - $ref: '#/components/parameters/BookingId'
    post:
      tags: [Check-in]
      operationId: checkInReservation
      summary: Assign a ready room and check in a confirmed reservation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckInRequest'
      responses:
        '200':
          description: Checked-in reservation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /bookings/{bookingId}/check-out:
    parameters:
      - $ref: '#/components/parameters/BookingId'
    post:
      tags: [Check-out]
      operationId: checkOutReservation
      summary: Finalize the folio and check out a reservation
      description: Applies any late fee, requires a zero settled balance, and releases the occupied room.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Checked-out reservation and closure metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckOutResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/FolioBalanceOutstanding'
        '422':
          $ref: '#/components/responses/ValidationError'
  /bookings/{bookingId}/room-move:
    parameters:
      - $ref: '#/components/parameters/BookingId'
    post:
      tags: [In-stay modifications]
      operationId: moveCheckedInReservationRoom
      summary: Move a checked-in reservation to another room
      description: Reassigns room inventory and adjusts the folio for remaining nights atomically.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomMoveRequest'
      responses:
        '200':
          description: Reservation moved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StayChangeResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InventoryUnavailable'
        '422':
          $ref: '#/components/responses/ValidationError'
  /bookings/{bookingId}/departure-adjustment:
    parameters:
      - $ref: '#/components/parameters/BookingId'
    post:
      tags: [In-stay modifications]
      operationId: adjustCheckedInReservationDeparture
      summary: Extend a checked-in stay or schedule an early departure
      description: Checks added-night inventory and appends the signed folio adjustment atomically.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartureAdjustmentRequest'
      responses:
        '200':
          description: Departure adjusted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StayChangeResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InventoryUnavailable'
        '422':
          $ref: '#/components/responses/ValidationError'
  /bookings/{bookingId}/cancel:
    parameters:
      - $ref: '#/components/parameters/BookingId'
    post:
      tags: [Reservations]
      operationId: cancelReservation
      summary: Cancel a pending or confirmed reservation
      description: Applies the reservation's configured policy and posts the resulting folio entries.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cancelled reservation and evaluated policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancellationResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /properties/{propertyId}/maintenance-tickets:
    get:
      tags: [Maintenance]
      operationId: listMaintenanceTickets
      summary: List a property's maintenance board
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PropertyId'
        - name: status
          in: query
          schema:
            type: string
            enum: [open, assigned, in_progress, resolved]
        - name: priority
          in: query
          schema:
            type: string
            enum: [normal, high, urgent]
        - name: escalation_status
          in: query
          schema:
            type: string
            enum: [none, escalated, critical]
        - name: assigned_to
          in: query
          schema:
            $ref: '#/components/schemas/Identifier'
        - name: room_id
          in: query
          schema:
            $ref: '#/components/schemas/Identifier'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated maintenance tickets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceTicketCollectionResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Maintenance]
      operationId: createMaintenanceTicket
      summary: Open a ticket and take a vacant room out of service
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PropertyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceTicketCreateRequest'
      responses:
        '201':
          description: Ticket opened and room blocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceTicketResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /properties/{propertyId}/maintenance-tickets/{ticketId}:
    parameters:
      - $ref: '#/components/parameters/PropertyId'
      - $ref: '#/components/parameters/MaintenanceTicketId'
    get:
      tags: [Maintenance]
      operationId: getMaintenanceTicket
      summary: Retrieve a maintenance ticket
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Maintenance ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceTicketResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Maintenance]
      operationId: updateMaintenanceTicket
      summary: Update ticket details, priority, or escalation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceTicketUpdateRequest'
      responses:
        '200':
          description: Updated maintenance ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceTicketResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Maintenance]
      operationId: deleteMaintenanceTicket
      summary: Delete a ticket and restore an unresolved room's prior status
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Ticket deleted
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /properties/{propertyId}/maintenance-tickets/{ticketId}/assignment:
    patch:
      tags: [Maintenance]
      operationId: assignMaintenanceTicket
      summary: Assign or reassign an open maintenance ticket
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PropertyId'
        - $ref: '#/components/parameters/MaintenanceTicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceAssignmentRequest'
      responses:
        '200':
          description: Assigned ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceTicketResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /properties/{propertyId}/maintenance-tickets/{ticketId}/start:
    post:
      tags: [Maintenance]
      operationId: startMaintenanceTicket
      summary: Start an assigned maintenance ticket
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PropertyId'
        - $ref: '#/components/parameters/MaintenanceTicketId'
      responses:
        '200':
          description: In-progress ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceTicketResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /properties/{propertyId}/maintenance-tickets/{ticketId}/resolve:
    post:
      tags: [Maintenance]
      operationId: resolveMaintenanceTicket
      summary: Resolve a ticket and restore the room to clean inventory
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PropertyId'
        - $ref: '#/components/parameters/MaintenanceTicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceResolutionRequest'
      responses:
        '200':
          description: Resolved ticket and clean room
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceTicketResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /properties/{propertyId}/maintenance-tickets/{ticketId}/history:
    get:
      tags: [Maintenance]
