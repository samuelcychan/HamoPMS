        max_occupancy:
          type: integer
        base_rate:
          type: string
          pattern: '^\\d+\\.\\d{2}$'
        total_inventory:
          type: integer
          minimum: 0
        blocked_inventory:
          type: integer
          minimum: 0
        reserved_inventory:
          type: integer
          minimum: 0
        available_inventory:
          type: integer
          minimum: 1
