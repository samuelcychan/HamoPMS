        - name
        - code
        - max_occupancy
        - base_rate
        - total_inventory
        - blocked_inventory
        - reserved_inventory
        - available_inventory
      properties:
        room_type_id:
          $ref: '#/components/schemas/Identifier'
        property_id:
          $ref: '#/components/schemas/Identifier'
        name:
          type: string
        code:
