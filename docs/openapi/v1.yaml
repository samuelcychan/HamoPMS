openapi: 3.1.0
info:
  title: HamoPMS API
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
  description: |
    Versioned contract for the Sprint 1 HamoPMS endpoints. All successful JSON
    responses use a `data` envelope and errors use the shared `error` envelope.
servers:
  - url: /api/v1
tags:
  - name: Authentication
    description: Registration, token issuance, revocation, and current-user access.
  - name: Availability
    description: Property-scoped room-type availability searches.
  - name: Reservations
    description: Reservation creation, retrieval, updates, and deletion.
  - name: Check-in
    description: Front-desk room assignment and guest arrival processing.
  - name: Check-out
    description: Folio finalization, balance validation, and room release.
  - name: In-stay modifications
    description: Checked-in room moves, extensions, and early departures.
  - name: Ancillary charges
    description: Property charge types and immutable add-on folio postings.
  - name: Payments
    description: Idempotent intent, capture, refund, void, and split settlement.
  - name: Payment webhooks
    description: Signed gateway settlement reconciliation.
paths:
  /auth/register:
    post:
      tags: [Authentication]
      operationId: registerUser
      summary: Register a user and issue an API token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/login:
    post:
      tags: [Authentication]
      operationId: loginUser
      summary: Authenticate and issue an API token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logoutUser
      summary: Revoke the current API token
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/me:
    get:
      tags: [Authentication]
      operationId: getAuthenticatedUser
      summary: Return the authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /availability:
    get:
      tags: [Availability]
      operationId: searchAvailability
      summary: Search available room types for a stay
      description: Supply the property through `property_id` or `X-Property-ID`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PropertyHeader'
        - name: property_id
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Identifier'
        - name: check_in
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: check_out
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: occupancy
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Matching room types and inventory counts
          headers:
            Server-Timing:
              schema:
                type: string
            X-Response-Time-Target:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityResponse'
        '400':
          $ref: '#/components/responses/PropertyContextRequired'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/PropertyContextMismatch'
        '422':
          $ref: '#/components/responses/ValidationError'
  /bookings:
    get:
      tags: [Reservations]
      operationId: listReservations
      summary: List reservations for the authenticated user and property
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequiredPropertyHeader'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated reservations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingCollectionResponse'
        '400':
          $ref: '#/components/responses/PropertyContextRequired'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Reservations]
      operationId: createReservation
      summary: Create a confirmed reservation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
      responses:
        '201':
          description: Reservation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/InventoryUnavailable'
        '422':
          $ref: '#/components/responses/ValidationError'
  /bookings/{bookingId}:
    parameters:
      - $ref: '#/components/parameters/BookingId'
    get:
      tags: [Reservations]
      operationId: getReservation
      summary: Return a reservation
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Reservation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Reservations]
      operationId: updateReservation
      summary: Update a reservation
      description: |
        Modifies a pending or confirmed reservation and appends an immutable
        folio rate adjustment plus a before/after audit record.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBookingRequest'
      responses:
        '200':
          description: Updated reservation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Reservations]
      operationId: deleteReservation
      summary: Delete a reservation
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Reservation deleted
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /bookings/{bookingId}/check-in:
    parameters:
      - $ref: '#/components/parameters/BookingId'
    post:
      tags: [Check-in]
      operationId: checkInReservation
      summary: Assign a ready room and check in a confirmed reservation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckInRequest'
      responses:
        '200':
          description: Checked-in reservation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /bookings/{bookingId}/check-out:
    parameters:
      - $ref: '#/components/parameters/BookingId'
    post:
      tags: [Check-out]
      operationId: checkOutReservation
      summary: Finalize the folio and check out a reservation
      description: Applies any late fee, requires a zero settled balance, and releases the occupied room.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Checked-out reservation and closure metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckOutResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/FolioBalanceOutstanding'
        '422':
          $ref: '#/components/responses/ValidationError'
  /bookings/{bookingId}/room-move:
    parameters:
      - $ref: '#/components/parameters/BookingId'
    post:
      tags: [In-stay modifications]
      operationId: moveCheckedInReservationRoom
      summary: Move a checked-in reservation to another room
      description: Reassigns room inventory and adjusts the folio for remaining nights atomically.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomMoveRequest'
      responses:
        '200':
          description: Reservation moved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StayChangeResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InventoryUnavailable'
        '422':
          $ref: '#/components/responses/ValidationError'
  /bookings/{bookingId}/departure-adjustment:
    parameters:
      - $ref: '#/components/parameters/BookingId'
    post:
      tags: [In-stay modifications]
      operationId: adjustCheckedInReservationDeparture
      summary: Extend a checked-in stay or schedule an early departure
      description: Checks added-night inventory and appends the signed folio adjustment atomically.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartureAdjustmentRequest'
      responses:
        '200':
          description: Departure adjusted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StayChangeResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InventoryUnavailable'
        '422':
          $ref: '#/components/responses/ValidationError'
  /bookings/{bookingId}/cancel:
    parameters:
      - $ref: '#/components/parameters/BookingId'
    post:
      tags: [Reservations]
      operationId: cancelReservation
      summary: Cancel a pending or confirmed reservation
      description: Applies the reservation's configured policy and posts the resulting folio entries.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cancelled reservation and evaluated policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancellationResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /properties/{propertyId}/ancillary-charge-types:
    parameters:
      - $ref: '#/components/parameters/PropertyId'
    get:
      tags: [Ancillary charges]
      operationId: listAncillaryChargeTypes
      summary: List property ancillary charge types
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated charge types
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AncillaryChargeTypeCollectionResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Ancillary charges]
      operationId: createAncillaryChargeType
      summary: Configure a property ancillary charge type
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AncillaryChargeTypeRequest'
      responses:
        '201':
          description: Charge type created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AncillaryChargeTypeResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /properties/{propertyId}/ancillary-charge-types/{chargeTypeId}:
    parameters:
      - $ref: '#/components/parameters/PropertyId'
      - $ref: '#/components/parameters/ChargeTypeId'
    put:
      tags: [Ancillary charges]
      operationId: updateAncillaryChargeType
      summary: Update a property ancillary charge type
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AncillaryChargeTypeUpdateRequest'
      responses:
        '200':
          description: Charge type updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AncillaryChargeTypeResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /bookings/{bookingId}/folio/ancillary-charges:
    parameters:
      - $ref: '#/components/parameters/BookingId'
    post:
      tags: [Ancillary charges]
      operationId: postAncillaryCharge
      summary: Post an ancillary charge and automatic tax
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AncillaryChargeRequest'
      responses:
        '201':
          description: Charge and tax posted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AncillaryChargeResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /bookings/{bookingId}/folio/ancillary-charges/{lineItemId}/adjustments:
    parameters:
      - $ref: '#/components/parameters/BookingId'
      - $ref: '#/components/parameters/LineItemId'
    post:
      tags: [Ancillary charges]
      operationId: adjustAncillaryCharge
      summary: Append an authorized adjustment or void
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AncillaryAdjustmentRequest'
      responses:
        '201':
          description: Adjustment or void posted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AncillaryAdjustmentResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /payments:
    post:
      tags: [Payments]
      operationId: createPayment
      summary: Create a payment tender or manual-capture card intent
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCreateRequest'
      responses:
        '200':
          description: Idempotent replay of an existing payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '201':
          description: Payment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/GatewayUnavailable'
  /payments/{paymentId}/capture:
    parameters:
      - $ref: '#/components/parameters/PaymentId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [Payments]
      operationId: capturePayment
      summary: Capture the full card tender
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Capture result or idempotent replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentOperationResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/GatewayUnavailable'
  /payments/{paymentId}/refund:
    parameters:
      - $ref: '#/components/parameters/PaymentId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [Payments]
      operationId: refundPayment
      summary: Refund part or all of a captured payment
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentAmountRequest'
      responses:
        '200':
          description: Refund result or idempotent replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentOperationResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/GatewayUnavailable'
  /payments/{paymentId}/void:
    parameters:
      - $ref: '#/components/parameters/PaymentId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [Payments]
      operationId: voidPayment
      summary: Void an uncaptured payment intent
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Void result or idempotent replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentOperationResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/GatewayUnavailable'
  /webhooks/stripe:
    post:
      tags: [Payment webhooks]
      operationId: receiveStripeWebhook
      summary: Verify and reconcile a Stripe event
      security: []
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Event accepted or replay acknowledged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAcknowledgementResponse'
        '400':
          $ref: '#/components/responses/InvalidWebhook'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum token
  parameters:
    BookingId:
      name: bookingId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    PropertyId:
      name: propertyId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    ChargeTypeId:
      name: chargeTypeId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    LineItemId:
      name: lineItemId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
    PropertyHeader:
      name: X-Property-ID
      in: header
      required: false
      description: Property context; must match any property identifier in the request.
      schema:
        $ref: '#/components/schemas/Identifier'
    RequiredPropertyHeader:
      name: X-Property-ID
      in: header
      required: true
      description: Property context for a collection request.
      schema:
        $ref: '#/components/schemas/Identifier'
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 15
  responses:
    PropertyContextRequired:
      description: A property context was not supplied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthenticated:
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: The user lacks access or permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PropertyContextMismatch:
      description: Property identifiers in the request do not match
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InventoryUnavailable:
      description: Inventory is unavailable for one or more requested nights
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    FolioBalanceOutstanding:
      description: The folio has a non-zero balance after completed payments
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    GatewayUnavailable:
      description: The configured payment gateway is temporarily unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidWebhook:
      description: The webhook signature or timestamp is invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: The request contains invalid data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Identifier:
      type: integer
      format: int64
      minimum: 1
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [name, email, password, password_confirmation]
      properties:
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 8
          format: password
        password_confirmation:
          type: string
          minLength: 8
          format: password
    LoginRequest:
      type: object
      additionalProperties: false
