        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum token
  parameters:
    BookingId:
      name: bookingId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    PropertyId:
      name: propertyId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    AmenityId:
      name: amenityId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    RoomId:
      name: roomId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    HousekeepingTaskId:
      name: taskId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    MaintenanceTicketId:
      name: ticketId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    ChargeTypeId:
      name: chargeTypeId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    LineItemId:
      name: lineItemId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
    ReportPropertyId:
      name: property_id
      in: query
      required: false
      description: Property context; required when X-Property-ID is omitted.
      schema:
        $ref: '#/components/schemas/Identifier'
    ReportDate:
      name: date
      in: query
      required: false
      description: Report date; defaults to today in the application timezone.
      schema:
        type: string
        format: date
    ReportFormat:
      name: format
      in: query
      required: false
      description: Response representation; defaults to JSON.
      schema:
        type: string
        enum: [json, csv]
        default: json
    RevenueStartDate:
      name: start_date
      in: query
      required: false
      description: Inclusive period start; defaults to today.
      schema:
        type: string
        format: date
    RevenueEndDate:
      name: end_date
      in: query
      required: false
      description: Inclusive period end; defaults to start_date and is limited to 366 days.
      schema:
        type: string
        format: date
    ReportCurrency:
      name: currency
      in: query
      required: false
      description: Three-letter report currency; defaults to USD.
      schema:
        type: string
        pattern: '^[A-Za-z]{3}$'
        default: USD
    PeriodCloseId:
      name: periodCloseId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    PropertyHeader:
      name: X-Property-ID
      in: header
      required: false
      description: Property context; must match any property identifier in the request.
      schema:
        $ref: '#/components/schemas/Identifier'
    RequiredPropertyHeader:
      name: X-Property-ID
      in: header
      required: true
      description: Property context for a collection request.
      schema:
        $ref: '#/components/schemas/Identifier'
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 15
  responses:
    PropertyContextRequired:
      description: A property context was not supplied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthenticated:
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: The user lacks access or permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PropertyContextMismatch:
      description: Property identifiers in the request do not match
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InventoryUnavailable:
      description: Inventory is unavailable for one or more requested nights
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    FolioBalanceOutstanding:
      description: The folio has a non-zero balance after completed payments
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    GatewayUnavailable:
      description: The configured payment gateway is temporarily unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidWebhook:
      description: The webhook signature or timestamp is invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    StayReport:
      description: Operational stay report in the requested representation
      headers:
        X-Report-Row-Count:
          schema:
            type: integer
          description: Present for CSV responses.
        Server-Timing:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StayReportResponse'
        text/csv:
          schema:
            type: string
    OccupancyReport:
      description: Occupancy report in the requested representation
      headers:
        X-Report-Row-Count:
          schema:
